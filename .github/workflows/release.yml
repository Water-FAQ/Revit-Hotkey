name: Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        shell: cmd
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name "Revit Hotkey"
          --icon "revit_hotkey\resources\icon.ico"
          --version-file "version_info.txt"
          --add-data "revit_hotkey\resources\icon.png;revit_hotkey\resources"
          main.py

      - name: Create portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist\Revit Hotkey.exe" "release\Revit Hotkey.exe"
          Copy-Item "README_RELEASE.txt" "release\README.txt"
          Compress-Archive -Path "release\*" -DestinationPath "Revit-Hotkey.zip" -Force
          (Get-FileHash "Revit-Hotkey.zip" -Algorithm SHA256).Hash.ToLower() + "  Revit-Hotkey.zip" | Set-Content "SHA256SUMS.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Revit-Hotkey-Windows
          path: |
            Revit-Hotkey.zip
            SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: Revit Hotkey ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          body_path: CHANGELOG.md
          files: |
            Revit-Hotkey.zip
            SHA256SUMS.txt
          generate_release_notes: true
